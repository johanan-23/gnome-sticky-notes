    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0b3a4a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="256" fill="#ffffff"/>
  <g clip-path="url(#circle)">
