[package]
name = "sticky-notes"
version = "1.0.0"
edition = "2021"
publish = false
license = "GPL-2.0-or-later"
description = "Sticky Notes for the GNOME desktop"

[dependencies]
gtk4 = { version = "0.10", default-features = false, features = ["v4_18"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
overflow-checks = false
